quarkus.http.body.uploads-directory=/data/photos
quarkus.http.body.delete-uploaded-files-on-end=true
quarkus.http.limits.max-body-size=50M

app.download-dir=/uploads/photos
app.photo-test-dir=/images
app.photos-system-dir=/data/photos

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:photoDB;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=admin
%test.quarkus.datasource.password=admin

%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.log.sql=false